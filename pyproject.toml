[project]
name = "arca-sync-monitor-api"
version = "1.0.0"
description = "API REST de integración ARCA -> receptor y monitoreo de servidores Linux/Windows"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning:paramiko.*",
    "ignore::DeprecationWarning:apscheduler.*",
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["app", "mock_arca"]
omit = ["app/scheduler.py"]

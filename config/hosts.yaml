# Hosts a monitorear. Tipos soportados:
#   local -> el host donde corre la API (psutil). Sirve para Linux y Windows Server.
#   ssh   -> servidor Linux remoto vía SSH (paramiko). No requiere agente.
#
# Los umbrales globales salen de las variables de entorno (CPU_WARNING, DISK_CRITICAL, etc.)
# y se pueden sobreescribir por host en `thresholds`.

hosts:
  - name: api-local
    type: local
    services: []          # ej. [nginx, docker] en Linux o [W3SVC, MSSQLSERVER] en Windows

